name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test the core and the command line
        run: |
          go vet ./internal/... ./cmd/...
          go test ./internal/... ./cmd/...
      - name: Cross-build the command line for macOS
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/elappma
      - name: Build the frontend
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          wails3 generate bindings -ts -i -clean=true
          cd frontend && npm ci && npm run build
      - name: Cross-build the app for macOS (CGO-free backend)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -tags purego .
