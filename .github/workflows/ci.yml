name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # a normal run takes about a minute; never wait long for a stuck one
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test the core and the command line
        run: |
          go vet ./internal/... ./cmd/...
          go test ./internal/... ./cmd/...
      - name: Cross-build the command line for macOS
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/lieferling
      - name: Build the frontend
        run: |
          # the binding generator reads the Go code, it needs no GTK or WebKitGTK
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          wails3 generate bindings -ts -i -clean=true
          cd frontend && npm ci && npm run build
      - name: Cross-build the app for macOS (CGO-free backend)
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -tags purego .
