# Builds Elappma for macOS when a tag like v0.1.0 is pushed and attaches the
# DMG and the command line to that tag's GitHub release. Elappma can then
# manage its own updates: add pklaschka/elappma to its list.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" build/darwin/Info.plist
      - name: Build the app (universal) and its DMG
        run: |
          wails3 task darwin:package:universal
          wails3 task darwin:create:dmg
          mkdir -p dist
          mv bin/*.dmg "dist/Elappma-$VERSION-universal.dmg"
          ditto -c -k --keepParent bin/Elappma.app "dist/Elappma-$VERSION-mac-universal.zip"
      - name: Build the command line
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -ldflags "-s -w" -o elappma ./cmd/elappma
            tar -czf "dist/elappma-cli-$VERSION-darwin-$arch.tar.gz" elappma
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes $prerelease
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
